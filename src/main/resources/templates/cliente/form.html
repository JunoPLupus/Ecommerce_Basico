<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main}, ~{::script})}">
<head th:replace="~{fragments/head :: head('Cadastrar Cliente',~{})}"></head>
<body>
<main class="pg-card pg-auth-card">

    <div class="pg-auth-header">
        <h1>Crie sua conta</h1>
        <p>Bem-vindo(a). Preencha seus dados para começar.</p>
    </div>

    <ul class="pg-segmented">
        <li>
            <a id="nav-item-pf"
               th:classappend="${activeTab == 'pj'} ? '' : 'active'"
               aria-current="page" href="#">Pessoa Física</a>
        </li>
        <li>
            <a id="nav-item-pj"
               th:classappend="${activeTab == 'pj'} ? 'active' : ''"
               href="#">Pessoa Jurídica</a>
        </li>
    </ul>

    <div id="container-pf" th:attr="hidden=${activeTab == 'pj'} ? 'hidden' : null">
        <div th:replace="~{fragments/cliente-form-pf :: form-pf}"></div>
    </div>

    <div id="container-pj" th:attr="hidden=${activeTab != 'pj'} ? 'hidden' : null">
        <div th:replace="~{fragments/cliente-form-pj :: form-pj}"></div>
    </div>

</main>

<script th:src="@{/js/cliente-form.js}"></script>

</body>
</html>
