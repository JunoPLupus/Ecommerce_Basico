<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main}, ~{})}">
<head th:replace="~{fragments/head :: head('Meus Pedidos',~{})}"></head>
<body>
<main class="pg-checkout-page">

    <h1>Meus Pedidos</h1>
    <p class="text-muted">Acompanhe o status de suas compras, visualize detalhes e gerencie suas devoluções em um só lugar.</p>

    <div th:replace="~{fragments/alert :: alert(${erro})}"></div>

    <p th:if="${#lists.isEmpty(pedidos)}" class="text-muted">Você ainda não realizou nenhum pedido.</p>

    <div class="pg-pedidos-lista" th:unless="${#lists.isEmpty(pedidos)}">
        <div class="pg-pedido-card" th:each="pedido : ${pedidos}">
            <img class="cart-img-thumbnail"
                 th:if="${!#lists.isEmpty(pedido.itens) && pedido.itens[0].produto.urlImagem != null}"
                 th:src="${pedido.itens[0].produto.urlImagem}" alt="Produto do pedido">

            <div class="pg-pedido-card__info">
                <p class="pg-pedido-card__numero" th:text="'Pedido #' + ${pedido.id}"></p>
                <span class="pg-pedido-card__data">
                    <i class="icon-calendar"></i>
                    <span th:text="${#temporals.format(pedido.data, 'dd ''de'' MMMM, yyyy')}"></span>
                </span>
            </div>

            <div class="pg-pedido-card__total">
                <span class="pg-pedido-card__total-label">Total</span>
                <span class="pg-pedido-card__total-valor"
                      th:text="'R$ ' + ${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')}"></span>
            </div>

            <a class="button-dark" th:href="@{/pedidos/detalhes/{id}(id=${pedido.id})}">
                <i class="icon-eye"></i> Ver Detalhes <i class="icon-arrow-right"></i>
            </a>
        </div>
    </div>

</main>
</body>
</html>
