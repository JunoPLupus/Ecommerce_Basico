<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main}, ~{})}">
<head th:replace="~{fragments/head :: head('Meu Perfil',~{})}"></head>
<body>
<main class="pg-checkout-page" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <h1>Meu Perfil</h1>
    <p class="text-muted">Gerencie suas informações pessoais e endereços de entrega.</p>
    <div th:replace="~{fragments/alert :: alert(${erro})}"></div>

    <section class="pg-card">
        <div class="pg-card-header">
            <h2><i class="icon-document"></i> Dados Pessoais</h2>
            <a class="button-secondary" th:href="@{/clientes/editar}">
                <i class="icon-pen"></i> Editar dados
            </a>
        </div>
        <div class="pg-data-grid">
            <div class="pg-data-field">
                <span class="pg-data-label">Nome / Razão Social</span>
                <span th:text="${pessoa.nomeExibicao}"></span>
            </div>
            <div class="pg-data-field">
                <span class="pg-data-label">CPF / CNPJ</span>
                <span th:text="${pessoa.documento}"></span>
            </div>
            <div class="pg-data-field">
                <span class="pg-data-label">E-mail</span>
                <span th:text="${pessoa.email}"></span>
            </div>
            <div class="pg-data-field">
                <span class="pg-data-label">Telefone</span>
                <span th:text="${pessoa.telefone}"></span>
            </div>
        </div>
    </section>

    <section class="pg-card" sec:authorize="hasAnyRole('USER')">
        <div class="pg-card-header">
            <h2><i class="icon-pin"></i> Gerenciamento de Endereços</h2>
            <a class="button-primary" th:href="@{/enderecos/insert}">+ Cadastrar novo endereço</a>
        </div>

        <p th:if="${#lists.isEmpty(pessoa.enderecos)}" class="text-muted">
            Você ainda não tem endereços cadastrados.
        </p>

        <div class="pg-addresses-grid" th:unless="${#lists.isEmpty(pessoa.enderecos)}">
            <div class="pg-address-card" th:each="endereco : ${pessoa.enderecos}">
                <div class="pg-address-card__info">
                    <strong th:text="${endereco.logradouro + (endereco.numero != null ? ', ' + endereco.numero : '')}"></strong>
                    <span th:text="${endereco.bairro + ', ' + endereco.cidade + ' - ' + endereco.estado}"></span>
                    <span th:text="'CEP: ' + ${endereco.cep}"></span>
                </div>
                <div class="pg-address-card__actions">
                    <a th:href="@{/enderecos/edit/{id}(id=${endereco.id})}" class="button-secondary">
                        <i class="icon-pen"></i>
                    </a>
                    <form th:action="@{/enderecos/delete/{id}(id=${endereco.id})}" method="post"
                          onsubmit="return confirm('Tem certeza que deseja excluir esse endereço? É uma ação irreversível.')">
                        <button type="submit" class="button-danger"><i class="icon-trash"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </section>

</main>
</body>
</html>
