<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<form th:fragment="form-pj"
      th:action="@{/clientes/save/juridica}"
      th:object="${pessoaJuridica}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div class="pg-form-fields">
        <div>
            <label for="razaoSocial">Razão Social</label>
            <input type="text" th:field="*{razaoSocial}" id="razaoSocial" placeholder="Empresa LTDA.">
            <span th:if="${#fields.hasErrors('razaoSocial')}" th:errors="*{razaoSocial}" class="pg-field-error"></span>
        </div>
        <div>
            <label for="cnpj">CNPJ</label>
            <input type="text" th:field="*{cnpj}" id="cnpj" placeholder="00.000.000/0000-00">
            <span th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}" class="pg-field-error"></span>
        </div>
        <div>
            <label for="email-pj">E-mail</label>
            <input type="email" th:field="*{email}" id="email-pj" placeholder="contato@empresa.com">
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="pg-field-error"></span>
        </div>
        <div>
            <label for="login-pj">Usuário</label>
            <input type="text" name="login" id="login-pj" placeholder="empresa.ltda">
            <span th:if="${erroLogin}" th:text="${erroLogin}" class="pg-field-error"></span>
        </div>
        <div>
            <label for="password-pj">Senha</label>
            <div class="pg-senha-field">
                <input type="password" name="password" id="password-pj" placeholder="Mínimo 6 caracteres">
                <button type="button" class="pg-senha-field__toggle">
                    <i class="icon-eye"></i>
                </button>
            </div>
            <span th:if="${erroSenha}" th:text="${erroSenha}" class="pg-field-error"></span>
        </div>
    </div>

    <button type="submit" class="button-dark pg-auth-submit">Criar minha conta</button>

    <hr>
    <p class="pg-auth-footer">Já tem uma conta? <a th:href="@{/login}">Entre agora!</a></p>

</form>

</body>
</html>
