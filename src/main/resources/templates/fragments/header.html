<header class="pg-header" th:fragment="header" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <nav class="pg-nav">
        <div class="pg-nav-container">
            <a class="pg-nav-brand" th:href="@{/produtos}">
                <img th:src="@{/images/logo.svg}" alt="E-COMMERCE" height="40">
            </a>
            <button class="pg-nav-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="pg-nav-collapse" id="navbarSupportedContent">
                <ul>
                    <li sec:authorize="hasAnyRole('ADMIN')">
                        <a th:href="@{/admin/vendas}">Vendas</a>
                    </li>
                    <li sec:authorize="hasAnyRole('ADMIN')">
                        <a th:href="@{/admin/produtos}">Produtos</a>
                    </li>
                    <li sec:authorize="hasAnyRole('ADMIN')">
                        <a th:href="@{/admin/clientes}">Clientes</a>
                    </li>
                    <li sec:authorize="!hasAnyRole('ADMIN')">
                        <a th:href="@{/produtos}">Loja</a>
                    </li>
                </ul>

                <a sec:authorize="hasAnyRole('USER')" class="pg-nav-cart" th:href="@{/carrinho}" title="Carrinho">
                    <i class="icon-cart"></i>
                    <span class="pg-nav-cart__badge"
                          th:if="${session.carrinho != null && !#lists.isEmpty(session.carrinho.getItens())}"
                          th:text="${session.carrinho.qtdItensTotal()}"></span>
                </a>

                <a sec:authorize="!isAuthenticated()" class="pg-nav-link" th:href="@{/login}">Entrar</a>
                <a sec:authorize="!isAuthenticated()" class="button-light" th:href="@{/clientes/cadastro}">Cadastrar</a>

                <div sec:authorize="isAuthenticated()" class="pg-nav-user dropdown">
                    <button class="pg-nav-user__toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="pg-nav-user__avatar" sec:authentication="principal.avatarLetter"></span>
                    </button>
                    <ul class="pg-nav-user__menu dropdown-menu dropdown-menu-end">
                        <li>
                            <div class="pg-nav-user__menu-header">
                                <div class="pg-nav-user__avatar-lg" sec:authentication="principal.avatarLetter"></div>
                                <div class="pg-nav-user__full-name">
                                    Olá, <span sec:authentication="principal.nomeCurto"></span>!
                                </div>
                                <div class="pg-nav-user__username">@<span sec:authentication="principal.username"></span></div>
                            </div>
                        </li>
                        <li>
                            <a class="pg-nav-user__menu-profile" th:href="@{/clientes/perfil}">
                                <i class="icon-person"></i> Meu Perfil
                            </a>
                        </li>
                        <li sec:authorize="hasAnyRole('USER')">
                            <a class="pg-nav-user__menu-item" th:href="@{/pedidos/list}">
                                <i class="icon-bag"></i> Meus pedidos
                            </a>
                        </li>
                        <li class="pg-nav-user__menu-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="pg-nav-user__menu-item">
                                    <i class="icon-logout"></i> Sair
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
