<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main}, ~{})}">
<head th:replace="~{fragments/head :: head('Login',~{})}"></head>
<body>
<main class="pg-card pg-auth-card">

    <div class="pg-auth-header">
        <h1>Bem-vindo de volta</h1>
        <p>Por favor, insira suas credenciais para continuar.</p>
    </div>

    <div th:if="${param.error != null}">
        <div th:replace="~{fragments/alert :: alert('Usuário ou senha inválidos. Verifique suas credenciais e tente novamente.')}"></div>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="pg-form-fields">
            <div>
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" placeholder="nome.exemplo">
            </div>
            <div>
                <label for="password">Senha</label>
                <div class="pg-senha-field">
                    <input type="password" id="password" name="password" placeholder="Sua senha">
                    <button type="button" class="pg-senha-field__toggle">
                        <i class="icon-eye"></i>
                    </button>
                </div>
            </div>
        </div>

        <button type="submit" class="button-dark pg-auth-submit">Entrar</button>

        <hr>
        <p class="pg-auth-footer">Ainda não tem uma conta? <a th:href="@{/clientes/cadastro}">Cadastre-se!</a></p>
    </form>

</main>
</body>
</html>
