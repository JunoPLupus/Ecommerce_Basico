<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main}, ~{})}">
<head th:replace="~{fragments/head :: head('Vendas',~{})}"></head>
<body>
<main class="pg-checkout-page">

    <h1>Gestão de Vendas</h1>
    <p class="text-muted">Gerencie todas as vendas realizadas na plataforma.</p>

    <form th:action="@{/admin/vendas}" method="get" class="search-bar">
        <input type="search" id="nomeCliente" name="nomeCliente" placeholder="Buscar por nome ou razão social do cliente..." aria-label="Filtro por nome de cliente" th:value="${nomeCliente}">
        <div class="dropdown">
            <button class="filter-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="icon-filter"></i> Filtrar
            </button>
            <ul class="dropdown-menu">
                <li>
                    <label for="date-picker">Data ou intervalo</label>
                    <div class="input-group">
                        <span><i class="icon-calendar"></i></span>
                        <input type="text" class="date-picker" id="date-picker" placeholder="Selecione a(s) data(s)">
                    </div>
                    <input type="hidden" name="dataInicial" id="dataInicial" th:value="${dataInicial}">
                    <input type="hidden" name="dataFinal" id="dataFinal" th:value="${dataFinal}">
                </li>
                <li>
                    <label for="valorMinimo">Valor Total (R$)</label>
                    <div class="input-group">
                        <input type="number" step="0.01" min="0" name="valorMinimo" id="valorMinimo" placeholder="Valor mínimo" th:value="${valorMinimo}">
                        <input type="number" step="0.01" min="0" name="valorMaximo" id="valorMaximo" placeholder="Valor máximo" th:value="${valorMaximo}" aria-label="Valor máximo">
                    </div>
                </li>
            </ul>
        </div>
        <button class="button-secondary" type="submit" id="button-search">
            <i class="icon-search"></i>
        </button>
    </form>

    <div th:if="${filtrosAplicados != null}">
        <span th:text="${filtrosAplicados} + ' filtro(s) aplicado(s).'"></span>
        <a th:href="@{/admin/vendas}">Limpar filtros</a>
    </div>

    <p th:if="${vendas == null || #lists.isEmpty(vendas)}">Nenhuma venda encontrada.</p>

    <div class="pg-lista" th:unless="${vendas == null || #lists.isEmpty(vendas)}">
        <div class="pg-lista-card" th:each="venda : ${vendas}">
            <img class="cart-img-thumbnail"
                 th:if="${!#lists.isEmpty(venda.itens) && venda.itens[0].produto.urlImagem != null}"
                 th:src="${venda.itens[0].produto.urlImagem}" alt="Produto da venda">

            <div class="pg-lista-card__info">
                <span class="pg-lista-card__id" th:text="'ID #' + ${venda.id}"></span>
                <p class="pg-lista-card__titulo" th:text="${venda.cliente.nomeExibicao}"></p>
            </div>

            <div class="pg-lista-card__metrica">
                <span class="pg-data-label">Data</span>
                <span class="pg-lista-card__metrica-valor" th:text="${#temporals.format(venda.data, 'dd MMM, yyyy')}"></span>
            </div>

            <div class="pg-lista-card__metrica">
                <span class="pg-data-label">Total</span>
                <span class="pg-lista-card__metrica-valor" th:text="'R$ ' + ${#numbers.formatDecimal(venda.total, 1, 'POINT', 2, 'COMMA')}"></span>
            </div>

            <a class="button-icon-dark" th:href="@{/admin/vendas/detalhes/{id}(id=${venda.id})}"
               data-bs-toggle="tooltip" data-bs-placement="top" title="Ver detalhes da venda">
                <i class="icon-eye"></i>
            </a>
        </div>
    </div>

</main>
</body>
</html>
